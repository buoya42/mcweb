name: Build and deploy MCWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build browser output
        working-directory: mc1211-browser-research
        run: |
          chmod +x gradlew
          ./gradlew clean war

      - name: Prepare website
        run: |
          mkdir -p dist
          WAR="$(find mc1211-browser-research/build/libs -name '*.war' -print -quit)"
          test -n "$WAR"
          cd dist
          jar -xf "../$WAR"
          touch .nojekyll
          test -s index.html
          test -s game.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
